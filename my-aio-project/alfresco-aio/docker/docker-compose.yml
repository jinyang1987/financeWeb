version: '3.4'
services:
  alfresco-aio-share:
    image: alfresco-share-alfresco-aio:development
    build:
      dockerfile: ./Dockerfile
      context: ../alfresco-aio-share-docker/target
    environment:
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
      REPO_HOST: alfresco-aio-acs
      REPO_PORT: 8080
    ports:
      - "8180:8080"
      - "9898:8888"
  alfresco-aio-acs:
    image: alfresco-content-services-alfresco-aio:development
    build:
      dockerfile: ./Dockerfile
      context: ../alfresco-aio-platform-docker/target
    environment:
      JAVA_TOOL_OPTIONS: "-Dencryption.keystore.type=JCEKS -Dencryption.cipherAlgorithm=AES/CBC/PKCS5Padding -Dencryption.keyAlgorithm=AES -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore -Dmetadata-keystore.password=mp6yc0UD9e -Dmetadata-keystore.aliases=metadata -Dmetadata-keystore.metadata.password=oKIWzVdEdA -Dmetadata-keystore.metadata.algorithm=AES"
      JAVA_OPTS: "
        -Dfile.encoding=UTF-8
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Ddb.url=jdbc:postgresql://alfresco-aio-postgres:5432/alfresco?charSet=UTF-8
        -Dmessaging.broker.url=\"failover:(nio://alfresco-aio-activemq:61616)?timeout=3000&jms.useCompression=true\"
        "
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - alfresco-aio-acs-volume:/usr/local/tomcat/alf_data
    depends_on:
      - alfresco-aio-postgres
  alfresco-aio-postgres:
    image: postgres:16.5
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG -c client_encoding=UTF8
    ports:
      - "15432:5432"
    volumes:
      - alfresco-aio-db-volume:/var/lib/postgresql/data
  alfresco-aio-ass:
    image: alfresco/alfresco-search-services:2.0.15
    environment:
      SOLR_ALFRESCO_HOST: alfresco-aio-acs
      SOLR_ALFRESCO_PORT: 8080
      SOLR_SOLR_HOST: alfresco-aio-ass
      SOLR_SOLR_PORT: 8983
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco,archive
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms.secret=secret"
    ports:
      - "8983:8983"
    volumes:
      - alfresco-aio-ass-volume:/opt/alfresco-search-services/contentstore
      - alfresco-aio-ass-volume:/opt/alfresco-search-services/data
  alfresco-aio-activemq:
      image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8
      mem_limit: 1g
      ports:
        - 8161:8161
        - 15672:5672
        - 61616:61616
        - 61613:61613
  alfresco-aio-transform-core:
    image: alfresco/alfresco-transform-core-aio:2.6.0
    mem_limit: 2g
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    ports:
      - "8090:8090"
  alfresco-aio-tesseract:
    image: tesseractshadow/tesseract4re:latest
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "8091:8080"

volumes:
  alfresco-aio-acs-volume:
    external: true
  alfresco-aio-db-volume:
    external: true
  alfresco-aio-ass-volume:
    external: true